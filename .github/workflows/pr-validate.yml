name: PR validate

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: >-
          npm test --
          tests/core/model.test.ts tests/core/model-evidence.test.ts
          tests/core/guard.test.ts tests/core/hook-inventory.test.ts
          tests/core/otlp.test.ts tests/core/adapter-version.test.ts
          tests/handlers/pre-tool-use-guard-input.test.ts
          tests/handlers/gate-output.test.ts tests/handlers/output-guard.test.ts
          tests/handlers/deferred-telemetry.test.ts
      - run: npm run test:otlp
      - run: npm run test:redact
      - run: npm run smoke:model
